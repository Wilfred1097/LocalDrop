<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalDrop - Network File Share</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 relative">

    <!-- Spacer to help center the card vertically -->
    <div></div>

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
        <h1 class="text-2xl font-bold text-center mb-2">LocalDrop 🌐</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Discovered devices on your local network</p>

        <!-- Device Name Input with Edit / Randomize Controls -->
        <div class="mb-4">
            <div class="flex justify-between items-center mb-1">
                <label class="block text-xs uppercase tracking-wider text-slate-400">Your Device Name</label>
                <button onclick="generateNewRandomName()" class="text-xs text-indigo-400 hover:text-indigo-300 underline cursor-pointer">🎲 Roll New Name</button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="deviceName" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 font-medium">
                <button onclick="saveDeviceName()" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-4 rounded-lg font-medium transition cursor-pointer">Save</button>
            </div>
        </div>

        <!-- Progress Bar & Status Area -->
        <div id="statusArea" class="hidden mb-4 p-4 bg-slate-900 border border-slate-700 rounded-xl">
            <div class="flex justify-between text-xs text-slate-300 mb-2">
                <span id="statusText" class="font-medium truncate max-w-[220px]">Preparing transfer...</span>
                <span id="progressPercentage" class="font-bold text-indigo-400">0%</span>
            </div>
            <!-- Progress Track -->
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-150 w-0"></div>
            </div>
        </div>

        <!-- Discovered Devices List -->
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">Active Peers (<span id="peerCount">0</span>)</h2>
        <div id="deviceList" class="space-y-3">
            <div class="text-slate-500 text-sm text-center py-4 bg-slate-900/50 rounded-lg border border-dashed border-slate-700">
                Searching for local devices...
            </div>
        </div>
    </div>

    <!-- Incoming Connection Request Modal -->
    <div id="requestModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
            <div class="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">📁</div>
            <h3 class="text-lg font-bold mb-1">Incoming File Request</h3>
            <p id="requestDetails" class="text-sm text-slate-400 mb-6">Device wants to send you a file.</p>
            <div class="flex gap-3">
                <button onclick="rejectConnection()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-2.5 rounded-xl font-medium transition cursor-pointer">Decline</button>
                <button onclick="acceptConnection()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-xs py-2.5 rounded-xl font-medium transition cursor-pointer">Accept</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-xs text-slate-500 py-2 flex items-center gap-1">
        Created with <span class="text-rose-500">❤️</span> by <a href="https://github.com/Wilfred1097" target="_blank" class="text-indigo-400 hover:text-indigo-300 underline font-medium">Wil Fred</a>
    </footer>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" class="hidden">

    <!-- Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let candidateQueue = [];

        const deviceNameInput = document.getElementById('deviceName');
        const deviceListEl = document.getElementById('deviceList');
        const peerCountEl = document.getElementById('peerCount');
        const fileInput = document.getElementById('fileInput');
        
        // Modal elements
        const requestModal = document.getElementById('requestModal');
        const requestDetails = document.getElementById('requestDetails');

        // Progress elements
        const statusArea = document.getElementById('statusArea');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const progressPercentage = document.getElementById('progressPercentage');

        let targetPeerId = null;
        let selectedFile = null;
        let pc = null;
        let dataChannel = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.stunprotocol.org:3478' }
            ]
        };

        const adjectives = ['Cosmic', 'Swift', 'Silent', 'Clever', 'Brave', 'Mighty', 'Hidden', 'Neon', 'Cyber', 'Epic', 'Chill', 'Hyper'];
        const nouns = ['Badger', 'Panda', 'Falcon', 'Tiger', 'Ninja', 'Wizard', 'Phoenix', 'Ghost', 'Viking', 'Nomad', 'Panther', 'Robot'];

        function getRandomName() {
            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            const num = Math.floor(Math.random() * 90) + 10;
            return `${adj} ${noun} ${num}`;
        }

        // --- Cookie Helper Functions ---
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/;SameSite=Lax";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return null;
        }

        function initName() {
            let savedName = getCookie('localdrop_device_name');
            if (!savedName) {
                savedName = getRandomName();
                setCookie('localdrop_device_name', savedName);
            }
            deviceNameInput.value = savedName;
        }

        function generateNewRandomName() {
            const newName = getRandomName();
            deviceNameInput.value = newName;
            saveDeviceName();
        }

        function saveDeviceName() {
            const name = deviceNameInput.value.trim() || 'Anonymous Device';
            setCookie('localdrop_device_name', name);
            register();
            
            const activeInput = document.activeElement;
            if(activeInput && activeInput.tagName === 'BUTTON') {
                const originalText = activeInput.textContent;
                activeInput.textContent = 'Saved!';
                setTimeout(() => activeInput.textContent = originalText, 1500);
            }
        }

        deviceNameInput.addEventListener('blur', saveDeviceName);

        function getDeviceType() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return 'Android Phone';
            if (/iphone|ipad|ipod/i.test(ua)) return 'iOS Device';
            if (/windows/i.test(ua)) return 'Windows PC';
            if (/macintosh|mac os x/i.test(ua)) return 'Mac';
            return 'Web Browser';
        }

        function register() {
            socket.emit('register-device', {
                name: deviceNameInput.value || 'Anonymous',
                type: getDeviceType()
            });
        }

        initName();
        socket.on('connect', register);

        socket.on('update-device-list', (devices) => {
            peerCountEl.textContent = devices.length;
            if (devices.length <= 1) {
                deviceListEl.innerHTML = `<div class="text-slate-500 text-sm text-center py-4 bg-slate-900/50 rounded-lg border border-dashed border-slate-700">No other devices found. Open this page on another device!</div>`;
                return;
            }

            deviceListEl.innerHTML = '';
            devices.forEach(device => {
                const isSelf = device.id === socket.id;
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border flex items-center justify-between ${isSelf ? 'bg-indigo-950/40 border-indigo-500/40' : 'bg-slate-900 border-slate-700'}`;
                
                card.innerHTML = `
                    <div>
                        <div class="font-medium text-sm flex items-center gap-2">
                            ${device.name} ${isSelf ? '<span class="text-xs bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded">You</span>' : ''}
                        </div>
                        <div class="text-xs text-slate-400">${device.type} • ${device.ip}</div>
                    </div>
                    ${!isSelf ? `<button onclick="initiateSend('${device.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded-lg font-medium transition cursor-pointer">Send File</button>` : ''}
                `;
                deviceListEl.appendChild(card);
            });
        });

        function updateProgress(percent, text) {
            statusArea.classList.remove('hidden');
            progressBar.style.width = `${percent}%`;
            progressPercentage.textContent = `${percent}%`;
            if (text) statusText.textContent = text;
        }

        // --- Step 1: User clicks "Send File" ---
        function initiateSend(peerId) {
            targetPeerId = peerId;
            fileInput.click();
        }

        // When a file is chosen, send a request to the target peer first
        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (!selectedFile || !targetPeerId) return;

            updateProgress(0, `Waiting for recipient to accept...`);
            
            // Emit connection request with file metadata
            socket.emit('connection-request', {
                to: targetPeerId,
                fileName: selectedFile.name,
                fileSize: selectedFile.size
            });
        });

        // --- Step 2: Recipient receives connection request ---
        let incomingRequestFrom = null;

        socket.on('connection-request', ({ from, senderName, fileName, fileSize }) => {
            incomingRequestFrom = from;
            const sizeMB = (fileSize / (1024 * 1024)).toFixed(2);
            
            // Fallback to "A peer" if senderName is missing/undefined
            const nameToDisplay = senderName || 'A peer';
            
            requestDetails.textContent = `"${nameToDisplay}" wants to send you "${fileName}" (${sizeMB} MB). Do you accept?`;
            requestModal.classList.remove('hidden');
        });

        function acceptConnection() {
            requestModal.classList.add('hidden');
            socket.emit('connection-response', { to: incomingRequestFrom, accepted: true });
        }

        function rejectConnection() {
            requestModal.classList.add('hidden');
            socket.emit('connection-response', { to: incomingRequestFrom, accepted: false });
        }

        // --- Step 3: Sender handles response ---
        socket.on('connection-response', ({ accepted }) => {
            if (!accepted) {
                updateProgress(0, `❌ Request rejected by recipient.`);
                setTimeout(() => statusArea.classList.add('hidden'), 4000);
                return;
            }

            // If accepted, kick off WebRTC offer!
            updateProgress(0, `Connecting to send ${selectedFile.name}...`);
            candidateQueue = [];

            pc = new RTCPeerConnection(rtcConfig);

            pc.oniceconnectionstatechange = () => console.log("ICE Connection State:", pc.iceConnectionState);
            pc.onconnectionstatechange = () => console.log("Peer Connection State:", pc.connectionState);

            dataChannel = pc.createDataChannel('file-transfer', { ordered: true });
            setupDataChannelSender(selectedFile);

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { to: targetPeerId, candidate: event.candidate });
                }
            };

            pc.createOffer().then(offer => {
                pc.setLocalDescription(offer);
                socket.emit('rtc-offer', { to: targetPeerId, offer });
            });
        });

        // --- Step 4: WebRTC Handshake & File Transfer ---
        socket.on('rtc-offer', async ({ from, offer }) => {
            targetPeerId = from;
            candidateQueue = [];
            pc = new RTCPeerConnection(rtcConfig);

            pc.oniceconnectionstatechange = () => console.log("ICE Connection State:", pc.iceConnectionState);
            pc.onconnectionstatechange = () => console.log("Peer Connection State:", pc.connectionState);

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { to: targetPeerId, candidate: event.candidate });
                }
            };

            pc.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannelReceiver();
            };

            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            
            while (candidateQueue.length > 0) {
                await pc.addIceCandidate(candidateQueue.shift());
            }

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('rtc-answer', { to: targetPeerId, answer });
        });

        socket.on('rtc-answer', async ({ answer }) => {
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
            
            while (candidateQueue.length > 0) {
                await pc.addIceCandidate(candidateQueue.shift());
            }
        });

        socket.on('ice-candidate', async ({ candidate }) => {
            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error("Error adding received ice candidate", e);
                }
            } else {
                candidateQueue.push(new RTCIceCandidate(candidate));
            }
        });

        function setupDataChannelSender(file) {
            dataChannel.onopen = () => {
                updateProgress(0, `Sending: ${file.name}`);
                
                dataChannel.send(JSON.stringify({ name: file.name, size: file.size, type: file.type }));

                const chunkSize = 65536;
                const reader = new FileReader();
                let offset = 0;

                reader.onload = (e) => {
                    dataChannel.send(e.target.result);
                    offset += e.target.result.byteLength;
                    
                    const progress = Math.min(100, Math.round((offset / file.size) * 100));
                    updateProgress(progress, `Sending: ${file.name}`);

                    if (offset < file.size) {
                        readNextChunk();
                    } else {
                        updateProgress(100, `Sent ${file.name} successfully! 🎉`);
                        setTimeout(() => statusArea.classList.add('hidden'), 5000);
                    }
                };

                function readNextChunk() {
                    const slice = file.slice(offset, offset + chunkSize);
                    reader.readAsArrayBuffer(slice);
                }

                readNextChunk();
            };
        }

        let incomingFile = {};
        let receivedBuffer = [];
        let receivedSize = 0;

        function setupDataChannelReceiver() {
            updateProgress(0, `Connected! Waiting for file...`);

            dataChannel.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    incomingFile = JSON.parse(event.data);
                    receivedBuffer = [];
                    receivedSize = 0;
                    updateProgress(0, `Receiving: ${incomingFile.name}`);
                } else {
                    receivedBuffer.push(event.data);
                    receivedSize += event.data.byteLength;

                    const progress = Math.min(100, Math.round((receivedSize / incomingFile.size) * 100));
                    updateProgress(progress, `Receiving: ${incomingFile.name}`);

                    if (receivedSize === incomingFile.size) {
                        const blob = new Blob(receivedBuffer, { type: incomingFile.type });
                        const url = URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = incomingFile.name;
                        a.click();

                        updateProgress(100, `Received ${incomingFile.name} successfully! 📥`);
                        setTimeout(() => statusArea.classList.add('hidden'), 5000);
                    }
                }
            };
        }
    </script>
</body>
</html>
